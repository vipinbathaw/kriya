openapi: 3.0.3
info:
  title: Kriya API
  description: API for Notes, Finance & Nutrition modules
  version: 1.0.0
  contact:
    name: Kriya Team

servers:
  - url: http://localhost:3000/api
    description: Development
  - url: https://api.kriya.app/api
    description: Production

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details: {}

    # ─── Auth ──────────────────────────────────────
    RegisterInput:
      type: object
      required: [email, password, displayName]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        displayName: { type: string, minLength: 1, maxLength: 100 }

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }

    AuthResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        accessToken: { type: string }
        verificationRequired: { type: boolean, description: 'True when the account requires email verification and no session was issued' }

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        avatarUrl: { type: string, nullable: true }
        emailVerified: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Profile:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        avatarUrl: { type: string, nullable: true }
        theme: { type: string, enum: [light, dark, system] }

    UpdateProfileInput:
      type: object
      properties:
        displayName: { type: string, minLength: 1, maxLength: 100 }
        theme: { type: string, enum: [light, dark, system] }

    # ─── Notes ────────────────────────────────────
    Note:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        tags: { type: array, items: { type: string } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateNoteInput:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 255 }
        description: { type: string, maxLength: 10000 }

    UpdateNoteInput:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 255 }
        description: { type: string, maxLength: 10000 }

    # ─── Finance ──────────────────────────────────
    FinanceEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        type: { type: string, enum: [credit, debit] }
        title: { type: string }
        description: { type: string }
        amount: { type: integer }
        currency: { type: string }
        tags: { type: array, items: { type: string } }
        entryDate: { type: string, format: date }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateFinanceEntryInput:
      type: object
      required: [type, title, amount]
      properties:
        type: { type: string, enum: [credit, debit] }
        title: { type: string, minLength: 1, maxLength: 255 }
        description: { type: string, maxLength: 10000 }
        amount: { type: integer, minimum: 1 }
        currency: { type: string, default: INR }
        entryDate: { type: string, format: date }

    FinanceSummary:
      type: object
      properties:
        totalCredits: { type: integer }
        totalDebits: { type: integer }
        balance: { type: integer }
        currency: { type: string }

    # ─── Nutrition ────────────────────────────────
    NutritionEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        rawInput: { type: string }
        mealType: { type: string, enum: [breakfast, lunch, dinner, snack] }
        entryDate: { type: string, format: date }
        status: { type: string, enum: [pending, completed, failed] }
        aiGenerated: { type: boolean }
        errorMessage: { type: string, nullable: true }
        items:
          type: array
          items:
            $ref: '#/components/schemas/NutritionItem'
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    NutritionItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        foodName: { type: string }
        quantity: { type: number }
        unit: { type: string }
        calories: { type: number }
        proteinG: { type: number }
        carbsG: { type: number }
        fatG: { type: number }
        fiberG: { type: number }
        sugarG: { type: number }
        sodiumMg: { type: number }
        saturatedFatG: { type: number }
        transFatG: { type: number }
        monounsaturatedFatG: { type: number }
        polyunsaturatedFatG: { type: number }
        cholesterolMg: { type: number }
        potassiumMg: { type: number }
        calciumMg: { type: number }
        ironMg: { type: number }
        vitaminAIug: { type: number }
        vitaminCMg: { type: number }
        vitaminDIug: { type: number }
        vitaminEMg: { type: number }
        vitaminKIug: { type: number }
        vitaminB6Mg: { type: number }
        vitaminB12Iug: { type: number }
        folateIug: { type: number }
        magnesiumMg: { type: number }
        zincMg: { type: number }
        phosphorusMg: { type: number }
        seleniumIug: { type: number }
        copperMg: { type: number }
        manganeseMg: { type: number }

    CreateNutritionEntryInput:
      type: object
      required: [rawInput, mealType]
      properties:
        rawInput: { type: string, minLength: 1 }
        mealType: { type: string, enum: [breakfast, lunch, dinner, snack] }
        entryDate: { type: string, format: date }

    # ─── AI Config ────────────────────────────────
    AIProvider:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        models: { type: array, items: { type: string } }

    UserAIConfig:
      type: object
      properties:
        module: { type: string, enum: [notes, finance, nutrition] }
        aiEnabled: { type: boolean }
        provider: { type: string, nullable: true }
        model: { type: string, nullable: true }

    UpdateAIConfigInput:
      type: object
      properties:
        aiEnabled: { type: boolean }
        provider: { type: string, nullable: true }
        model: { type: string, nullable: true }

    APIKeyInput:
      type: object
      required: [provider, apiKey]
      properties:
        provider: { type: string }
        apiKey: { type: string, minLength: 8 }

    APIKeyResponse:
      type: object
      properties:
        provider: { type: string }
        keyPreview: { type: string }
        isActive: { type: boolean }

paths:
  # ─── Health ─────────────────────────────────────
  /health:
    get:
      tags: [System]
      summary: Health check
      responses:
        '200':
          description: Service healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  timestamp: { type: string, format: date-time }

  # ─── Auth ──────────────────────────────────────
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      description: When email verification is enabled, no access token is returned and the user must verify their email before logging in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'
      responses:
        '201':
          description: User registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '409': { description: Email already exists }

  /auth/login:
    post:
      tags: [Auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401': { description: Invalid credentials }
        '403': { description: 'Email not verified (EMAIL_NOT_VERIFIED)' }

  /auth/resend-verification:
    post:
      tags: [Auth]
      summary: Resend the email verification link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200':
          description: Verification email sent (or no-op if the address is unknown or already verified)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout
      responses:
        '204': { description: Logged out }
        '401': { description: No refresh token cookie }

  /auth/verify-email:
    get:
      tags: [Auth]
      summary: Verify email address
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Email verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        '400': { description: Invalid or missing token }

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current user
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  # ─── Settings ───────────────────────────────────
  /settings/profile:
    get:
      tags: [Settings]
      summary: Get user profile and settings
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'

    put:
      tags: [Settings]
      summary: Update profile or settings
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileInput'
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'

  # ─── Notes ──────────────────────────────────────
  /notes:
    get:
      tags: [Notes]
      summary: List notes
      security: [{ BearerAuth: [] }]
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
        - name: tag
          in: query
          schema: { type: string }
      responses:
        '200':
          description: List of notes
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Note' } }
                  nextCursor: { type: string }

    post:
      tags: [Notes]
      summary: Create note
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNoteInput'
      responses:
        '201':
          description: Note created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'

  /notes/{id}:
    get:
      tags: [Notes]
      summary: Get note by ID
      security: [{ BearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Note details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '404': { description: Note not found }

    put:
      tags: [Notes]
      summary: Update note
      security: [{ BearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNoteInput'
      responses:
        '200':
          description: Note updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '404': { description: Note not found }

    delete:
      tags: [Notes]
      summary: Delete note
      security: [{ BearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Note deleted }

  # ─── Finance ────────────────────────────────────
  /finance:
    get:
      tags: [Finance]
      summary: List finance entries
      security: [{ BearerAuth: [] }]
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
        - name: type
          in: query
          schema: { type: string, enum: [credit, debit] }
        - name: tag
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: List of entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/FinanceEntry' } }
                  nextCursor: { type: string }

    post:
      tags: [Finance]
      summary: Create finance entry
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFinanceEntryInput'
      responses:
        '201':
          description: Entry created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceEntry'

  /finance/summary:
    get:
      tags: [Finance]
      summary: Get finance summary
      security: [{ BearerAuth: [] }]
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceSummary'

  /finance/{id}:
    get:
      tags: [Finance]
      summary: Get entry by ID
      security: [{ BearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Entry details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceEntry'
        '404': { description: Entry not found }

    put:
      tags: [Finance]
      summary: Update entry
      security: [{ BearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFinanceEntryInput'
      responses:
        '200':
          description: Entry updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceEntry'
        '404': { description: Entry not found }

    delete:
      tags: [Finance]
      summary: Delete entry
      security: [{ BearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Entry deleted }

  # ─── Nutrition ──────────────────────────────────
  /nutrition:
    get:
      tags: [Nutrition]
      summary: List nutrition entries
      security: [{ BearerAuth: [] }]
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: mealType
          in: query
          schema: { type: string, enum: [breakfast, lunch, dinner, snack] }
      responses:
        '200':
          description: List of entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/NutritionEntry' } }
                  nextCursor: { type: string }

    post:
      tags: [Nutrition]
      summary: Create nutrition entry
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNutritionEntryInput'
      responses:
        '201':
          description: Entry created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NutritionEntry'

  /nutrition/{id}:
    get:
      tags: [Nutrition]
      summary: Get nutrition entry by ID
      security: [{ BearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Entry details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NutritionEntry'
        '404': { description: Entry not found }

    delete:
      tags: [Nutrition]
      summary: Delete entry
      security: [{ BearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Entry deleted }

  # ─── AI Config ──────────────────────────────────
  /ai/providers:
    get:
      tags: [AI Settings]
      summary: List available AI providers
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: List of providers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AIProvider'

  /ai/configs:
    get:
      tags: [AI Settings]
      summary: Get AI configs for all modules
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: AI configs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserAIConfig'

  /ai/configs/{module}:
    put:
      tags: [AI Settings]
      summary: Update AI config for a module
      security: [{ BearerAuth: [] }]
      parameters:
        - name: module
          in: path
          required: true
          schema: { type: string, enum: [notes, finance, nutrition] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAIConfigInput'
      responses:
        '200':
          description: Config updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
        '400': { description: Invalid module or provider }

  /ai/keys:
    get:
      tags: [AI Settings]
      summary: List stored API keys
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: List of API keys (previews)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/APIKeyResponse'

    post:
      tags: [AI Settings]
      summary: Store API key
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/APIKeyInput'
      responses:
        '200':
          description: Key stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKeyResponse'

  /ai/keys/{provider}:
    delete:
      tags: [AI Settings]
      summary: Delete API key for a provider
      security: [{ BearerAuth: [] }]
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Key deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
